[project]
name = "rag-lab"
version = "0.1.0"
description = "RAG over Apache Spark docs: dense, BM25, and hybrid (RRF) retrieval"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pyyaml",
    "requests",
    "sentence-transformers",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]
notebook = [
    "ipykernel",
    "jupyter",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag_lab"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
